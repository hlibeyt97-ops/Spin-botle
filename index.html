<!DOCTYPE html><html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{margin:0;background:#0f0f0f;color:#fff;font-family:system-ui;text-align:center}
#h{display:flex;justify-content:space-between;padding:12px;background:#1a1a1a}span{background:#222;padding:6px 12px;border-radius:20px;font-size:13px}
#g{width:360px;height:500px;margin:10px auto;position:relative;background:radial-gradient(circle,#2a2a2a,#000);border-radius:24px;border:1px solid #333}
.seat{position:absolute;width:50px;height:50px;background:#1f1f1f;border:2px solid #ffcc00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold}
.seat.active{border-color:#00ff88;box-shadow:0 0 15px #00ff88;transform:scale(1.2)}
#b{position:absolute;left:50%;top:50%;width:110px;height:20px;background:#fff;border-radius:10px 4px 4px 10px;transform:translate(-50%,-50%);transition:transform 3.5s cubic-bezier(.15,.8,.3,1)}#b::after{content:'';position:absolute;right:-18px;top:50%;border-left:18px solid #ffcc00;border-top:7px solid transparent;border-bottom:7px solid transparent;transform:translateY(-50%)}
#btn{margin:15px;padding:16px 50px;background:#ffcc00;color:#000;border:none;border-radius:14px;font-weight:900;font-size:18px}</style></head><body>
<div id="h"><span>🎁 Bonus: 5000</span><span id="sc">🎵 22222</span></div><div id="g"><div id="b"></div></div><button id="btn">FIRLAT 🍾</button>
<script>const tg=Telegram.WebApp;tg.expand();const g=document.getElementById('g');const pos=[{x:8,y:8},{x:95,y:0},{x:190,y:0},{x:275,y:8},{x:0,y:140},{x:0,y:270},{x:310,y:140},{x:310,y:270},{x:8,y:430},{x:95,y:450},{x:190,y:450},{x:275,y:430}];
let seats=[];pos.forEach((p,i)=>{let d=document.createElement('div');d.className='seat';d.style.left=p.x+'px';d.style.top=p.y+'px';d.textContent='BOŞ';g.appendChild(d);seats.push(d)});
let ang=0,songs=22222,can=true;document.getElementById('btn').onclick=()=>{if(!can)return;can=false;seats.forEach(s=>s.classList.remove('active'));ang+=1440+Math.random()*1440;document.getElementById('b').style.transform=`translate(-50%,-50%) rotate(${ang}deg)`;tg.HapticFeedback.impactOccurred('heavy');
setTimeout(()=>{let w=Math.floor((ang%360)/30);seats[w].classList.add('active');songs++;document.getElementById('sc').textContent='🎵 '+songs;can=true;tg.HapticFeedback.notificationOccurred('success');},3500)};</script></body></html>
