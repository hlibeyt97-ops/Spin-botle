<style>
body{margin:0;font-family:system-ui;background:#d9a86c;overflow:hidden}
#top{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#c08a4a}
#top div{display:flex;gap:8px;align-items:center}
.icon{width:38px;height:38px;background:#ffffff55;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
#table{width:100%;height:52vh;background:radial-gradient(circle at center,#eec88d 0%, #d69a5a 50%, #a47132 100%);position:relative;border-top:3px solid #8d5a24;border-bottom:3px solid #8d5a24}
.seat{position:absolute;width:64px;text-align:center}
.seat img{width:60px;height:60px;border-radius:12px;border:2px solid #fff;object-fit:cover;box-shadow:0 2px 6px #0005}
.seat span{font-size:11px;background:#0008;color:#fff;border-radius:8px;padding:1px 4px;display:block;margin-top:2px;white-space:nowrap}
#bottle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;transition:transform 3s cubic-bezier(.15,.8,.3,1)}
#bottle div{font-size:52px;filter:drop-shadow(0 4px 8px #0008)}
#btxt{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);color:#fff;font-weight:900;text-shadow:0 2px 4px #000;width:90px;line-height:16px;font-size:16px}
#chat{background:#f5f5f5;height:32vh;overflow:auto;padding:6px}
.msg{background:#fff;border-radius:12px;padding:6px 10px;margin:5px;display:flex;gap:6px;align-items:center;box-shadow:0 1px 2px #0002}
.msg img{width:28px;height:28px;border-radius:50%}
#footer{display:flex;padding:6px;background:#fff;gap:6px}
#footer input{flex:1;border:none;background:#eee;border-radius:20px;padding:10px 14px}
#spinBtn{position:absolute;bottom:34vh;left:50%;transform:translateX(-50%);background:#ffcc00;color:#000;border:none;padding:12px 36px;border-radius:24px;font-weight:900;font-size:18px;box-shadow:0 4px 12px #0005;z-index:10}
</style></head><body>
