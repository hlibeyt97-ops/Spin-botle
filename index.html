<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#d9a86c;overflow:hidden}
#top{display:flex;justify-content:space-between;padding:6px;background:linear-gradient(#eab56a,#c68a3a);align-items:center}
#top .l{display:flex;gap:6px}
.i{width:34px;height:34px;background:#fff8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
#table{width:100%;height:58vh;background:radial-gradient(#f0c98a,#c48a3e);position:relative}
.seat{position:absolute;width:62px;text-align:center}
.seat img{width:52px;height:52px;border-radius:12px;border:2px solid #fff;object-fit:cover}
.seat span{font-size:10px;background:#0009;color:#fff;border-radius:8px;padding:1px 4px;display:inline-block}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
#bot{font-size:58px;filter:drop-shadow(0 4px 8px #0008);transition:transform 3s cubic-bezier(.2,.8,.2,1)}
#btxt{color:#fff;font-weight:900;font-size:18px;text-shadow:0 2px 6px #000;margin-top:-10px;line-height:18px}
#spinBtn{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:#ffcc00;border:none;padding:12px 32px;border-radius:20px;font-weight:900;font-size:17px;box-shadow:0 4px 10px #0005;z-index:5}
#chat{background:#f0f0f0;height:31vh;overflow:auto;padding:6px}
.m{background:#fff;border-radius:14px;padding:7px 10px;margin:4px 0;display:flex;gap:7px;box-shadow:0 1px 2px #0001}
.m img{width:26px;height:26px;border-radius:50%}
#footer{display:flex;gap:6px;padding:6px;background:#fff}
#footer input{flex:1;border:none;background:#eee;border-radius:20px;padding:10px 14px}
</style></head><body>
<div id="top"><div class="l"><div class="i">❤️ 4</div><div class="i">🎡</div><div class="i">🏆</div><div class="i">☰</div><div class="i">⚙️</div></div><div style="font-weight:700">Masa 0/7</div></div>

<div id="table">
<button id="spinBtn" onclick="spin()">FIRLAT 🍾</button>
<div id="center"><div id="bot">🍾</div><div id="btxt">Sonraki sırayı<br>bekliyoruz</div></div>
</div>

<div id="chat">
<div class="m"><img src="https://i.pravatar.cc/100?img=5"><div><b style="color:#e91e63">Elena:</b> Пока</div></div>
<div class="m"><img src="https://i.pravatar.cc/100?img=32"><div><b style="color:#e91e63">Dana:</b> Елена, ну а этот тоже, пусть будет)</div></div>
<div class="m"><img src="https://i.pravatar.cc/100?img=32"><div><b style="color:#e91e63">Dana:</b> Смурфики опять спортом занимаются)</div></div>
<div class="m"><img src="https://i.pravatar.cc/100?img=5"><div><b style="color:#e91e63">Elena:</b> Дана, в 51 уже тяжело бегать)</div></div>
</div>

<div id="footer"><input placeholder="Mesaj yaz"><div style="background:#ff9800;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff">➤</div></div>

<script>
const tg=Telegram.WebApp;tg.expand();
const table=document.getElementById('table');
const av=["1","3","6","8","9","10","11","12","16","26","29","31"];
const nm=["Irina,76","U","Zarina,30","- ,99","Dana,39","-,31","- ,98","Maks,41","Karina,76","Elena,36","Ali","-"];
const ps=[{x:2,y:2},{x:25,y:0},{x:50,y:0},{x:77,y:2},{x:0,y:28},{x:84,y:28},{x:0,y:54},{x:84,y:54},{x:2,y:82},{x:25,y:86},{x:50,y:86},{x:77,y:82}];
ps.forEach((p,i)=>{
 let d=document.createElement('div');d.className='seat';d.style.left=p.x+'%';d.style.top=p.y+'%';
 d.innerHTML=`<img src="https://i.pravatar.cc/100?img=${av[i]}"><span>${nm[i]}</span>`;
 table.appendChild(d);
});
let ang=0;
function spin(){ang+=1500+Math.random()*1000;document.getElementById('bot').style.transform=`rotate(${ang}deg)`;tg.HapticFeedback.impactOccurred('heavy');}
</script></body></html>
